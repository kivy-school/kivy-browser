<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kivy Playground</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main class="playground">
    <section class="editors">
      <div class="panes">
        <div class="pane" data-pane="kv">
          <header><button class="pane-toggle" type="button"><span class="chevron">▾</span> app.kv</button></header>
          <div class="editor" id="kv"></div>
        </div>
        <div class="pane" data-pane="py">
          <header><button class="pane-toggle" type="button"><span class="chevron">▾</span> app.py</button></header>
          <div class="editor" id="py"></div>
        </div>
      </div>
      <button class="rail" id="rail" type="button" title="Hide the code">
        <span class="chevron">‹</span>
        <span class="rail-label">app.kv · app.py</span>
      </button>
    </section>
    <section class="pane preview">
      <header>
        Kivy window
        <select id="template" title="Start from">
          <option value="kivy">Kivy</option>
          <option value="carbonkivy">CarbonKivy</option>
        </select>
        <span id="status">Loading…</span>
      </header>
      <iframe id="app" src="../runner/?playground" title="Kivy window" allow="autoplay; clipboard-read; clipboard-write"></iframe>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>

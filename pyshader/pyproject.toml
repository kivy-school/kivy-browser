[project]
name = "kivy-pyshader"
version = "0.1.0"
description = "PyShader shaders compiled to OpenGL ES 2 for Kivy"
requires-python = ">=3.13"
dependencies = ["kivy>=2.3"]

[build-system]
requires = ["pyshader>=0.0.8,<0.1.0", "pyshader-stdlib"]
build-backend = "pyshader_builder"

[tool.uv.sources]
# The newest PyShader release below 0.1.0: build.sh downloads its wheel, which
# carries the compiler, into build/pyshader-releases.
pyshader = { index = "pyshader-releases" }
pyshader-stdlib = { git = "https://github.com/NucleantUI/pyshader-stdlib", branch = "master" }

[[tool.uv.index]]
name = "pyshader-releases"
url = "../build/pyshader-releases"
format = "flat"
explicit = true

[tool.pyshader.effects-bloom]
source = "src/kivy_pyshader/effects/bloom.py"
output = "src/kivy_pyshader/effects/bloom.glsl"
format = "gles2"
single-file = true
position-attribute = "vPosition"
texcoord-attribute = "vTexCoords0"
position-matrices = ["projection_mat", "modelview_mat"]
uv-varying = "tex_coord0"
target = "compute"
content = true
content-sampler = "texture0"

[tool.pyshader.effects-blur]
source = "src/kivy_pyshader/effects/blur.py"

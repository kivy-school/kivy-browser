site_name: Kivy in the browser
site_description: Kivy 3 running on WebAssembly with Pyodide, SDL3 and WebGL2.
site_url: https://kivy-school.github.io/kivy-browser/
repo_url: https://github.com/kivy-school/kivy-browser
repo_name: kivy-school/kivy-browser
edit_uri: ""
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/apps.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Examples: examples.md
  - CarbonKivy: carbonkivy.md
  - KivyMD: kivymd.md
  - Playground: playground.md
